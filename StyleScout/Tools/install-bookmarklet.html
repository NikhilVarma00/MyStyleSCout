    .bookmark-btn { display: inline-block; padding: 12px 24px; background: #22c55e; color: #ffffff; font-weight: 700; font-size: 15px; text-decoration: none; border-radius: 8px; cursor: grab; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3); transition: all 0.3s ease; }
    .bookmark-btn:hover { transform: scale(1.02); box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4); }
    textarea { width: 100%; height: 140px; background: #11131a; color: #4ade80; border: 1px solid #232736; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 12px; resize: none; margin-top: 10px; }

<body>
  <div class="card">
    <h1>➕ Install StyleScout Bookmarklet</h1>
    <p>Drag the button below directly into your Chrome or Edge Bookmarks Bar:</p>
    <div class="drag-container">
      <a id="bookmarkletLink" class="bookmark-btn" href="#">🛒 Capture with StyleScout</a>
    </div>
    <p>Or copy the code below to paste manually into a bookmark's URL field:</p>
    <textarea id="code" readonly></textarea>
    <button class="action-btn" onclick="copyCode()">Copy Code to Clipboard</button>
  </div>

  <script>

    document.getElementById("code").value = rawCode;
    document.getElementById("bookmarkletLink").href = rawCode;

    function copyCode() {
      navigator.clipboard.writeText(rawCode).then(() => {
        alert("Bookmarklet code copied to clipboard!");
      }).catch(() => {
        const textarea = document.getElementById("code");
        textarea.select();
        document.execCommand("copy");
        alert("Bookmarklet code copied to clipboard!");

    }
