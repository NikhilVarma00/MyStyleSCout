<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Import Products to StyleScout | Track Prices Instantly</title>
<meta name="description" content="Use the StyleScout importer tool to quickly add products from Amazon, Flipkart, or Myntra and start tracking price drops instantly.">  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f1117;
      color: #f3f4f6;
      padding: 30px;
      max-width: 1000px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #232736;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: opacity 0.2s ease;
    }
    button:hover {
      opacity: 0.85;
    }
    .btn-refresh {
      background: #3b82f6;
      color: #fff;
    }
    .btn-export {
      background: #22c55e;
      color: #fff;
    }
    .btn-clear {
      background: #ef4444;
      color: #fff;
    }
    .grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      background: #171923;
      border: 1px solid #232736;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      gap: 16px;
      align-items: center;
      transition: all 0.3s ease;
    }
    .card:hover {
      border-color: #374151;
    }
    .preview-thumbs {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .preview-thumbs img {
      width: 65px;
      height: 85px;
      object-fit: cover;
      border-radius: 6px;
      background: #0f1117;
      border: 1px solid #2a2e3d;
    }
    .info {
      flex: 1;
      min-width: 0;
    }
    .info-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 4px;
    }
    .product-title {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      line-clamp: 2;
      box-orient: vertical;
      overflow: hidden;
    }
    .product-title:hover {
      text-decoration: underline;
    }
    .meta-tags {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .site-tag {
      padding: 4px 10px;
      border-radius: 6px;
      background: #232736;
      color: #38bdf8;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-delete {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-delete:hover {
      background: #ef4444;
      color: #ffffff;
      border-color: #ef4444;
    }
    .brand-name {
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 6px;
    }
    .price-tag {
      font-size: 18px;
      font-weight: 700;
      color: #22c55e;
    }
    textarea {
      width: 100%;
      height: 250px;
      margin-top: 24px;
      background: #11131a;
      color: #4ade80;
      border: 1px solid #232736;
      padding: 16px;
      border-radius: 12px;
      font-family: monospace;
      font-size: 13px;
      resize: vertical;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: #171923;
      border: 1px dashed #232736;
      border-radius: 12px;
      color: #6b7280;
    }
    .counter {
      font-size: 14px;
      color: #9ca3af;
      margin-left: 12px;
      font-weight: 400;
    }
  </style>
</head>
<body>

<header>
  <h1>📦 StyleScout Importer <span class="counter" id="counter"></span></h1>
  <div class="actions">
    <button class="btn-refresh" onclick="loadProducts()">Refresh</button>
    <button class="btn-export" onclick="exportJSON()">Export JSON</button>
    <button class="btn-clear" onclick="clearAll()">Clear All</button>
  </div>
</header>

<div id="list" class="grid"></div>

<textarea id="output" readonly placeholder="Click 'Export JSON' to output collected product data..."></textarea>

<script>
  const STORAGE_KEY = "stylescout_captured_products";

  function autoIngest() {
    const hash = window.location.hash;

    if (hash.includes("data=")) {
      try {
        const match = hash.match(/data=([^&]+)/);
        if (match) {
          const rawJson = decodeURIComponent(match[1]);
          const newProduct = JSON.parse(rawJson);

          if (newProduct && newProduct.url) {
            let products = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
            const existingIndex = products.findIndex(p => p.url === newProduct.url);

            if (existingIndex !== -1) {
              products[existingIndex] = newProduct;
            } else {
              products.unshift(newProduct);
            }

            localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
            loadProducts();
            exportJSON();
          }
        }
      } catch (e) {
        console.error("Failed to parse incoming product data:", e);
      }

      // Clean up hash from URL without closing the tab
      history.replaceState(null, "", window.location.pathname + window.location.search);
    }
  }

  function loadProducts() {
    const listEl = document.getElementById("list");
    const products = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    const counter = document.getElementById("counter");

    counter.textContent = `(${products.length} items)`;

    if (!products.length) {
      listEl.innerHTML = '<div class="empty-state">No products captured yet. Open Amazon, Flipkart, or Myntra and click the StyleScout bookmark.</div>';
      return;
    }

    listEl.innerHTML = products.map((p, idx) => `
      <div class="card">
        <div class="preview-thumbs">
<img src="${p.gallery?.[0] || p.image}" alt="Photo 1" onerror="this.style.opacity='0.2'">
<img src="${p.gallery?.[1] || p.gallery?.[0] || p.image}" alt="Photo 2" onerror="this.style.opacity='0.2'">
<img src="${p.gallery?.[2] || p.gallery?.[0] || p.image}" alt="Photo 3" onerror="this.style.opacity='0.2'">
        </div>
        <div class="info">
          <div class="info-top">
            <a href="${p.url}" target="_blank" class="product-title">${p.name}</a>
            <div class="meta-tags">
              <span class="site-tag">${p.site}</span>
              <button class="btn-delete" onclick="deleteProduct(${idx})">🗑️ Remove</button>
            </div>
          </div>
          <div class="brand-name">${p.brand}</div>
          <div class="price-tag">₹${p.price}</div>
        </div>
      </div>
    `).join("");
  }

  function deleteProduct(index) {
    let products = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    products.splice(index, 1);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
    loadProducts();
    exportJSON();
  }

  function exportJSON() {
    const products = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    const outputTextarea = document.getElementById("output");
    outputTextarea.value = JSON.stringify(products, null, 2);
    outputTextarea.select();
  }

  function clearAll() {
    if (confirm("Are you sure you want to clear all captured products?")) {
      localStorage.removeItem(STORAGE_KEY);
      document.getElementById("output").value = "";
      loadProducts();
    }
  }

  window.addEventListener("storage", (e) => {
    if (e.key === STORAGE_KEY) {
      loadProducts();
      exportJSON();
    }
  });

  autoIngest();
  loadProducts();
</script>

</body>
</html>
